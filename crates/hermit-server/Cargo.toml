[package]
name = "hermit-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
dirs = "7.0.0"
futures = "0.3.34"
hermit-ai = { version = "0.1.0", path = "../hermit-ai" }
hermit-core = { version = "0.1.0", path = "../hermit-core" }
hermit-diff = { version = "0.1.0", path = "../hermit-diff" }
hermit-engine = { version = "0.1.0", path = "../hermit-engine" }
hermit-github = { version = "0.1.0", path = "../hermit-github" }
hermit-store = { version = "0.1.0", path = "../hermit-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"

[lints]
workspace = true
