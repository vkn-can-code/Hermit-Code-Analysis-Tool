# Hermit bundled Semgrep rules. Every rule carries metadata.cwe and metadata.title.
# Severity mapping: ERROR -> high (critical when metadata.critical is true), WARNING -> medium, INFO -> low.
rules:
  # ------------------------------------------------------------------ Python
  - id: hermit.python.sql-injection
    languages: [python]
    severity: ERROR
    message: SQL text is built from variables and passed to execute(). Use bound parameters instead of string formatting.
    metadata: { cwe: "CWE-89", title: "SQL injection", critical: true }
    patterns:
      - pattern-either:
          - pattern: $DB.$EXEC(f"...", ...)
          - pattern: $DB.$EXEC("..." % $X, ...)
          - pattern: $DB.$EXEC("..." + $X, ...)
          - pattern: $DB.$EXEC("...".format(...), ...)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $Q = f"..."
                      ...
                  - pattern-inside: |
                      $Q = "..." % $X
                      ...
                  - pattern-inside: |
                      $Q = "..." + $X
                      ...
                  - pattern-inside: |
                      $Q = "...".format(...)
                      ...
              - pattern: $DB.$EXEC($Q, ...)
      - metavariable-regex: { metavariable: $EXEC, regex: "^(execute|executemany|executescript|raw|query|text)$" }

  - id: hermit.python.command-injection
    languages: [python]
    severity: ERROR
    message: Shell command built at runtime. Pass an argument list without shell=True.
    metadata: { cwe: "CWE-78", title: "OS command injection", critical: true }
    pattern-either:
      - patterns:
          - pattern: subprocess.$F(..., shell=True, ...)
          - pattern-not: subprocess.$F("...", ..., shell=True, ...)
      - patterns:
          - pattern-either:
              - pattern: os.system($X)
              - pattern: os.popen($X, ...)
          - pattern-not: os.system("...")
          - pattern-not: os.popen("...", ...)

  - id: hermit.python.code-injection
    languages: [python]
    severity: ERROR
    message: eval()/exec() on dynamic input executes arbitrary code.
    metadata: { cwe: "CWE-95", title: "Code injection" }
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
      - pattern-not: eval("...", ...)
      - pattern-not: exec("...", ...)

  - id: hermit.python.unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Deserializing untrusted data with pickle/marshal/yaml.load can execute code. Use json or yaml.safe_load.
    metadata: { cwe: "CWE-502", title: "Unsafe deserialization" }
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: marshal.loads(...)
      - patterns:
          - pattern: yaml.load(...)
          - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=SafeLoader, ...)

  - id: hermit.python.tls-verify-disabled
    languages: [python]
    severity: WARNING
    message: TLS certificate verification disabled; traffic can be intercepted.
    metadata: { cwe: "CWE-295", title: "Certificate validation disabled" }
    pattern: requests.$M(..., verify=False, ...)

  - id: hermit.python.weak-hash
    languages: [python]
    severity: WARNING
    message: MD5/SHA-1 are broken for security use. Use SHA-256 or a password KDF (bcrypt, argon2).
    metadata: { cwe: "CWE-327", title: "Weak cryptographic hash" }
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

  - id: hermit.python.flask-debug
    languages: [python]
    severity: WARNING
    message: Flask debug mode exposes an interactive debugger that allows code execution.
    metadata: { cwe: "CWE-489", title: "Debug mode enabled" }
    pattern: $APP.run(..., debug=True, ...)

  - id: hermit.python.path-traversal
    languages: [python]
    severity: WARNING
    message: File path built from request data may escape the intended directory.
    metadata: { cwe: "CWE-22", title: "Path traversal" }
    pattern-either:
      - pattern: open(request.$A[...], ...)
      - pattern: open(request.$A.get(...), ...)
      - pattern: open(os.path.join(..., request.$A.get(...), ...), ...)
      - pattern: open(os.path.join(..., request.$A[...], ...), ...)

  # ------------------------------------------------------------------ JavaScript / TypeScript
  - id: hermit.js.sql-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: SQL text built with interpolation or concatenation. Use parameter placeholders.
    metadata: { cwe: "CWE-89", title: "SQL injection", critical: true }
    patterns:
      - pattern-either:
          - pattern: $DB.$Q(`...${$X}...`, ...)
          - pattern: $DB.$Q("..." + $X, ...)
          - pattern: $DB.$Q('...' + $X, ...)
      - metavariable-regex: { metavariable: $Q, regex: "^(query|execute|raw|run|all|get)$" }

  - id: hermit.js.xss-inner-html
    languages: [javascript, typescript]
    severity: ERROR
    message: Assigning dynamic content to innerHTML/outerHTML enables cross-site scripting. Use textContent or sanitize.
    metadata: { cwe: "CWE-79", title: "Cross-site scripting" }
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
          - pattern: document.write($X)
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
      - pattern-not: document.write("...")

  - id: hermit.js.code-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: eval()/new Function() on dynamic input executes arbitrary code.
    metadata: { cwe: "CWE-95", title: "Code injection" }
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(...)
      - pattern-not: eval("...")

  - id: hermit.js.command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: child_process.exec runs a shell; dynamic arguments allow command injection. Use execFile with an argument array.
    metadata: { cwe: "CWE-78", title: "OS command injection", critical: true }
    patterns:
      - pattern-either:
          - pattern: $CP.exec($CMD, ...)
          - pattern: $CP.execSync($CMD, ...)
          - pattern: exec(`...${$X}...`, ...)
          - pattern: execSync(`...${$X}...`, ...)
      - pattern-not: $CP.exec("...", ...)
      - pattern-not: $CP.execSync("...", ...)
      - metavariable-regex: { metavariable: $CP, regex: "^(child_process|cp|childProcess|proc)$" }

  - id: hermit.js.weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: MD5/SHA-1 are broken for security use.
    metadata: { cwe: "CWE-327", title: "Weak cryptographic hash" }
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")

  - id: hermit.js.tls-reject-disabled
    languages: [javascript, typescript]
    severity: WARNING
    message: TLS certificate verification disabled.
    metadata: { cwe: "CWE-295", title: "Certificate validation disabled" }
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  # ------------------------------------------------------------------ Rust
  - id: hermit.rust.sql-injection
    languages: [rust]
    severity: ERROR
    message: SQL built with format! is passed to a query function. Use bind parameters.
    metadata: { cwe: "CWE-89", title: "SQL injection", critical: true }
    pattern-either:
      - pattern: sqlx::query(&format!(...))
      - pattern: sqlx::query(format!(...).as_str())
      - pattern: $C.execute(&format!(...), ...)
      - pattern: $C.query(&format!(...), ...)

  - id: hermit.rust.command-injection
    languages: [rust]
    severity: ERROR
    message: Spawning a shell with a runtime-built command string allows command injection.
    metadata: { cwe: "CWE-78", title: "OS command injection", critical: true }
    pattern-either:
      - pattern: Command::new("sh").arg("-c").arg(format!(...))
      - pattern: Command::new("bash").arg("-c").arg(format!(...))
      - pattern: std::process::Command::new("sh").arg("-c").arg(format!(...))

  - id: hermit.rust.unsafe-block
    languages: [rust]
    severity: INFO
    message: New unsafe block. Document the invariants it relies on and keep it minimal.
    metadata: { cwe: "CWE-119", title: "Unsafe code" }
    pattern: "unsafe { ... }"

  - id: hermit.rust.tls-verify-disabled
    languages: [rust]
    severity: WARNING
    message: TLS certificate verification disabled.
    metadata: { cwe: "CWE-295", title: "Certificate validation disabled" }
    pattern: $B.danger_accept_invalid_certs(true)
