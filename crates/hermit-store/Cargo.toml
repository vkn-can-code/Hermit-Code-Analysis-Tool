[package]
name = "hermit-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
hermit-core = { version = "0.1.0", path = "../hermit-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono", "migrate", "macros"] }

[lints]
workspace = true
