[package]
name = "hermit-ai"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
hermit-core = { version = "0.1.0", path = "../hermit-core" }
hermit-graph = { version = "0.1.0", path = "../hermit-graph" }
hex = "0.4.3"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["time", "macros", "rt-multi-thread"] }
tracing = "0.1.44"

[lints]
workspace = true
