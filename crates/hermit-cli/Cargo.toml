[package]
name = "hermit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
hermit-ai = { version = "0.1.0", path = "../hermit-ai" }
hermit-core = { version = "0.1.0", path = "../hermit-core" }
hermit-diff = { version = "0.1.0", path = "../hermit-diff" }
hermit-engine = { version = "0.1.0", path = "../hermit-engine" }
hermit-lang = { version = "0.1.0", path = "../hermit-lang" }
hermit-server = { version = "0.1.0", path = "../hermit-server" }
hermit-store = { version = "0.1.0", path = "../hermit-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
toml = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[[bin]]
name = "hermit"
path = "src/main.rs"
