[package]
name = "hermit-github"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["sync", "process"] }
tracing = "0.1.44"

[lints]
workspace = true
